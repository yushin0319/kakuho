version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # react-zxing 3.0 はバーコードスキャナー API の破壊的変更が大きく
    # frontend-test / typecheck がメジャー bump で fail する (PR #180 で実証)。
    # security advisory も無いため major 更新を抑止し、必要時に計画移行する。
    ignore:
      - dependency-name: "react-zxing"
        update-types: ["version-update:semver-major"]
    groups:
      # vitest 本体と @vitest/* は peerDependencies でバージョンを厳密指定して
      # いる ("@vitest/coverage-v8": "5.0.0" のように範囲指定ではない)。別 PR に
      # 分かれると 1 本ずつでは必ず peer 不整合 (npm ci の ERESOLVE) になり
      # マージできない (2026-09-10 に実際に #303/#306 の 2 分割で発生)。1 PR にまとめる。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
